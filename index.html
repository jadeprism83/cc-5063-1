<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>有理样条曲面查看与编辑器</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>Rational Spline Studio</strong>
      <span>精确 NURBS 求值 · 单侧节点分支 · 网格/模型导出</span>
      <span id="kernelBadge" class="kernel-badge" title="当前驱动求值与网格的样条内核">内核：待加载</span>
    </div>
    <div class="toolbar">
      <label>示例
        <select id="exampleSelect"></select>
      </label>
      <button id="saveProject">保存工程</button>
      <button id="openProject">打开工程</button>
      <input id="projectFile" type="file" accept=".json,application/json" hidden />
      <button id="exportOBJ">导出 OBJ</button>
      <button id="exportSTL">导出 STL</button>
      <button id="runVerification" class="primary">运行独立检查</button>
    </div>
  </header>

  <main class="layout">
    <aside class="panel left">
      <section>
        <h2>曲面参数</h2>
        <label class="full">名称<input id="specName" type="text" /></label>
        <div class="grid2">
          <label>U 次数<input id="degreeU" type="number" min="0" max="12" step="1" /></label>
          <label>V 次数<input id="degreeV" type="number" min="0" max="12" step="1" /></label>
        </div>
        <label class="full">U 节点向量（逗号/空格分隔）
          <textarea id="knotsU" rows="2"></textarea>
        </label>
        <label class="full">V 节点向量
          <textarea id="knotsV" rows="2"></textarea>
        </label>
        <button id="applyTopology" class="full">应用次数与节点向量</button>
        <div id="validationBox" class="validation"></div>
      </section>

      <section>
        <h2>选中控制点 <span id="selectedLabel"></span></h2>
        <div class="cp-editor">
          <label>X<input id="cpX" type="number" step="0.05" /></label>
          <label>Y<input id="cpY" type="number" step="0.05" /></label>
          <label>Z<input id="cpZ" type="number" step="0.05" /></label>
          <label>权重 w<input id="cpW" type="number" step="0.1" min="-1000000" /></label>
        </div>
        <div class="sliders">
          <label>X <input id="cpXSlider" type="range" min="-6" max="6" step="0.01" /></label>
          <label>Y <input id="cpYSlider" type="range" min="-4" max="4" step="0.01" /></label>
          <label>Z <input id="cpZSlider" type="range" min="-4" max="4" step="0.01" /></label>
          <label>w <input id="cpWSlider" type="range" min="0" max="5" step="0.01" /></label>
        </div>
        <details>
          <summary>完整控制点 / 权重矩阵</summary>
          <div id="cpTable" class="cp-table"></div>
        </details>
      </section>

      <section>
        <h2>网格与显示</h2>
        <div class="grid2">
          <label>U 分段<input id="segU" type="number" min="1" max="240" value="64" /></label>
          <label>V 分段<input id="segV" type="number" min="1" max="160" value="32" /></label>
        </div>
        <div class="checks">
          <label><input id="showSurface" type="checkbox" checked /> 曲面</label>
          <label><input id="showWire" type="checkbox" checked /> 网格线</label>
          <label><input id="showNet" type="checkbox" checked /> 控制网</label>
          <label><input id="showNormals" type="checkbox" /> 网格法线</label>
        </div>
        <p class="hint">鼠标左键旋转，Shift/右键拖动平移，滚轮缩放；点击橙色控制点可选择。</p>
      </section>
    </aside>

    <section class="viewer-wrap">
      <canvas id="viewer"></canvas>
      <div class="viewer-title" id="viewerTitle"></div>
      <div class="eval-bar">
        <label>U <input id="evalU" type="range" min="0" max="1000" value="500" /></label>
        <label>V <input id="evalV" type="range" min="0" max="1000" value="500" /></label>
        <label>U 侧
          <select id="sideU">
            <option value="auto">自动/右</option>
            <option value="1">右侧</option>
            <option value="-1">左侧</option>
          </select>
        </label>
        <label>V 侧
          <select id="sideV">
            <option value="auto">自动/右</option>
            <option value="1">右侧</option>
            <option value="-1">左侧</option>
          </select>
        </label>
      </div>
    </section>

    <aside class="panel right">
      <section>
        <h2>求值检查器</h2>
        <div id="inspector" class="inspector">移动 U/V 滑块查看位置、一阶导数、法线和分支。</div>
      </section>
      <section>
        <h2>等参线校验（新内核）</h2>
        <div class="iso-controls">
          <label class="grid2">
            方向
            <select id="isoFixed">
              <option value="u">固定 U（沿 V）</option>
              <option value="v">固定 V（沿 U）</option>
            </select>
          </label>
          <label class="grid2">
            固定值
            <input id="isoValue" type="number" step="0.01" value="0.5" />
          </label>
          <label class="checks"><input id="isoVisible" type="checkbox" checked /> 显示等参线</label>
        </div>
        <div id="isoReport" class="iso-report">拖动控制点或调整权重后将自动重新校验。</div>
      </section>
      <section>
        <h2>误差分布</h2>
        <div id="distribution" class="distribution">尚未运行检查。</div>
      </section>
      <section>
        <h2>关键位置 / 重复节点</h2>
        <div id="keyChecks" class="key-checks">尚未运行关键检查。</div>
      </section>
    </aside>
  </main>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
